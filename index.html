<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17151f">
<title>本命角色覺醒 Beta</title>
<style>
:root{--bg:#121119;--card:#201d2a;--line:#393344;--txt:#f5f1f7;--muted:#aaa2b3;--gold:#e6c879}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#15131d,#0e0d13);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:520px;margin:auto;padding:22px 16px 48px}.hero{text-align:center;padding:20px 4px 12px}.hero .sigil{font-size:42px}.hero h1{margin:7px 0;font-size:26px}.hero p{color:var(--muted);margin:0;line-height:1.6}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}.panel h2{font-size:18px;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,button{width:100%;min-height:48px;border-radius:13px;font-size:16px}input,select{background:#15131c;color:var(--txt);border:1px solid var(--line);padding:0 12px}
button{border:0;background:var(--gold);color:#211c10;font-weight:800;margin-top:16px}.secondary{background:#302b39;color:var(--txt);margin-top:9px}
.hidden{display:none}.reveal{text-align:center}.orb{width:116px;height:116px;margin:10px auto 16px;border-radius:50%;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle,#f5e6aa 0,#ae9044 34%,#302716 70%);box-shadow:0 0 32px #d6b85a55;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 50px #d6b85a77}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.rolecard{border:1px solid #6f6040;background:linear-gradient(145deg,#29242f,#17151d);border-radius:25px;padding:22px;text-align:center;position:relative;overflow:hidden}.rarity{font-size:12px;letter-spacing:3px;color:var(--gold)}.element{font-size:70px;margin:12px}.rolecard h2{font-size:26px;margin:4px}.subtitle{color:var(--gold);margin-bottom:16px}
.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip{background:#2d2934;border:1px solid #443d4c;border-radius:999px;padding:7px 10px;font-size:13px}
.stats{margin-top:17px;text-align:left}.stat{display:grid;grid-template-columns:34px 1fr 42px;align-items:center;gap:8px;margin:8px 0}.bar{height:8px;background:#38333f;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--gold);border-radius:9px}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:14px}.level{display:flex;justify-content:space-between;align-items:center}.xp{height:10px;background:#38333f;border-radius:10px;overflow:hidden;margin-top:9px}.xp i{display:block;height:100%;background:var(--gold);width:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{margin-top:10px}.small{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
</style>
</head>
<body><main>
<section class="hero"><div class="sigil">✦</div><h1>本命角色覺醒</h1><p>出生資料只在你的裝置上即時計算</p></section>

<section class="panel" id="formPanel">
<h2>建立本命資料</h2>
<form id="birthForm">
<label>國曆生日</label><input id="birth" type="date"  required>
<div class="row">
<div><label>出生時辰</label><select id="hour"><option>子時</option><option>丑時</option><option>寅時</option><option>卯時</option><option value="" selected disabled>請選擇</option><option>辰時</option><option>巳時</option><option>午時</option><option>未時</option><option>申時</option><option>酉時</option><option>戌時</option><option>亥時</option></select></div>
<div><label>性別</label><select id="sex"><option value="" selected disabled>請選擇</option><option>女</option><option>男</option><option>不指定</option></select></div>
</div>
<label>出生地</label><input id="place" placeholder="例如：台中市">
<button type="submit">開始覺醒</button><div class="note">🔒 此版本不預存任何人的生日、時辰、性別或出生地；GitHub 公開原始碼中也不包含玩家個資。</div>
</form>
<div class="note">Beta 版先驗證核心流程。日主採萬年曆日干支算法；完整八字節氣校正與紫微排盤將在後續版本加入。</div>
</section>

<section class="panel hidden reveal" id="reveal">
<div class="orb" id="orb">✦</div><h2 id="revealText">正在感應本命五行…</h2><p class="note">你的出生資料正在轉化為角色核心。</p>
</section>

<section class="hidden" id="result">
<div class="rolecard">
<div class="rarity">ORIGIN • 本命卡</div><div class="element" id="elementIcon">⚔️</div>
<h2 id="roleName">庚金・本命化身</h2><div class="subtitle" id="roleTitle">剛金之魂</div>
<div class="chips"><span class="chip" id="sunChip">♑ 摩羯座</span><span class="chip" id="dayChip">庚戌日</span><span class="chip" id="timeChip">辰時</span></div>
<div class="stats" id="stats"></div>
<p class="note" id="desc"></p>
</div>
<section class="panel">
<div class="level"><strong id="level">Lv. 1</strong><span id="xpText">成長 0 / 100</span></div><div class="xp"><i id="xpbar"></i></div>
<div class="actions"><button type="button" id="train">修煉 +10</button><button type="button" id="bond">互動 +5</button></div>
<p class="note" id="growthNote">角色達到更高成長階段後，未來可解鎖動態與 3D 化身。</p>
<button type="button" class="secondary" id="reset">重新測試</button>
</section>
</section>
<p class="small">娛樂與自我探索用途；命理系統不代表科學預測。</p>
</main>
<script>
(()=>{
const stems=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'], branches=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const stemEl=['木','木','火','火','土','土','金','金','水','水'];
const info={
木:{icon:'🌿',title:'生木之魂',desc:'以生長與延展為核心意象，角色傾向持續累積、探索與創造。'},
火:{icon:'🔥',title:'炎火之魂',desc:'以熱能與轉化為核心意象，角色傾向行動、表達與點燃變化。'},
土:{icon:'⛰️',title:'厚土之魂',desc:'以承載與穩固為核心意象，角色傾向累積、守護與建立秩序。'},
金:{icon:'⚔️',title:'剛金之魂',desc:'以鍛鍊與凝聚為核心意象，角色傾向精煉、判斷與建立界線。'},
水:{icon:'💧',title:'靈水之魂',desc:'以流動與感知為核心意象，角色傾向觀察、適應與尋找路徑。'}};
function jdn(y,m,d){let a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function dayGanzhi(y,m,d){let n=(jdn(y,m,d)+49)%60;return {stem:stems[n%10],branch:branches[n%12],idx:n%10}}
function zodiac(m,d){let z=[['摩羯座','♑',1,20],['水瓶座','♒',2,19],['雙魚座','♓',3,21],['牡羊座','♈',4,20],['金牛座','♉',5,21],['雙子座','♊',6,22],['巨蟹座','♋',7,23],['獅子座','♌',8,23],['處女座','♍',9,23],['天秤座','♎',10,24],['天蠍座','♏',11,23],['射手座','♐',12,22],['摩羯座','♑',13,1]];for(let i=0;i<12;i++){let end=z[i][2],ed=z[i][3];if(m<end||(m===end&&d<ed))return z[Math.max(0,i-1)].slice(0,2)}return ['摩羯座','♑']}
function buildStats(el){let base={木:[88,66,62,75,71],火:[69,91,72,61,78],土:[64,63,91,79,70],金:[68,76,80,92,67],水:[73,68,65,74,92]}[el];let names=['木','火','土','金','水'];return names.map((n,i)=>`<div class="stat"><span>${n}</span><div class="bar"><div class="fill" style="width:${base[i]}%"></div></div><span>${base[i]}</span></div>`).join('')}
let xp=0;
document.querySelector('#birthForm').addEventListener('submit',e=>{e.preventDefault();let v=document.querySelector('#birth').value;if(!v)return;let [y,m,d]=v.split('-').map(Number);let gz=dayGanzhi(y,m,d), el=stemEl[gz.idx], z=zodiac(m,d), hr=document.querySelector('#hour').value;
document.querySelector('#formPanel').classList.add('hidden');document.querySelector('#reveal').classList.remove('hidden');
setTimeout(()=>{document.querySelector('#revealText').textContent=`本命五行：${el}`;document.querySelector('#orb').textContent=info[el].icon},650);
setTimeout(()=>{document.querySelector('#reveal').classList.add('hidden');document.querySelector('#result').classList.remove('hidden');document.querySelector('#elementIcon').textContent=info[el].icon;document.querySelector('#roleName').textContent=`${gz.stem}${el}・本命化身`;document.querySelector('#roleTitle').textContent=info[el].title;document.querySelector('#sunChip').textContent=`${z[1]} ${z[0]}`;document.querySelector('#dayChip').textContent=`${gz.stem}${gz.branch}日`;document.querySelector('#timeChip').textContent=hr;document.querySelector('#stats').innerHTML=buildStats(el);document.querySelector('#desc').textContent=info[el].desc},1500);
});
function grow(n){xp+=n;let lv=Math.floor(xp/100)+1, rem=xp%100;document.querySelector('#level').textContent=`Lv. ${lv}`;document.querySelector('#xpText').textContent=`成長 ${rem} / 100`;document.querySelector('#xpbar').style.width=rem+'%';if(lv>=3)document.querySelector('#growthNote').textContent='✦ 已達覺醒門檻：未來版本可解鎖動態角色階段。'}
document.querySelector('#train').addEventListener('click',()=>grow(10));document.querySelector('#bond').addEventListener('click',()=>grow(5));document.querySelector('#reset').addEventListener('click',()=>{xp=0;document.querySelector('#result').classList.add('hidden');document.querySelector('#formPanel').classList.remove('hidden');grow(0)});
})();
</script></body></html>
