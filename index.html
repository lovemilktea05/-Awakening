<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121119">
<title>本命角色覺醒 Beta</title>
<style>
:root{--bg:#121119;--card:#201d2a;--line:#3b3546;--txt:#f7f3f8;--muted:#aaa2b3;--gold:#e5c778}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:linear-gradient(#15131d,#0d0c12);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
button,input,select{touch-action:manipulation;font:inherit}main{max-width:540px;margin:auto;padding:20px 15px 48px}.hero{text-align:center;padding:18px 0 10px}.hero b{font-size:42px}.hero h1{margin:6px 0;font-size:26px}.hero p{margin:0;color:var(--muted);line-height:1.6}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:15px}.panel h2{font-size:18px;margin:0 0 12px}
label{display:block;color:var(--muted);font-size:13px;margin:11px 0 6px}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
input,select,button{width:100%;min-width:0;min-height:48px;border-radius:13px;font-size:16px}input,select{border:1px solid var(--line);background:#15131c;color:var(--txt);padding:0 11px}
button{border:0;background:var(--gold);color:#211c10;font-weight:800;margin-top:15px}.secondary{background:#302b39;color:var(--txt);margin-top:9px}.hidden{display:none}
.privacy,.note{font-size:13px;color:var(--muted);line-height:1.6}.privacy{margin-top:12px}.reveal{text-align:center}.orb{width:112px;height:112px;border-radius:50%;margin:8px auto 15px;display:grid;place-items:center;font-size:50px;background:radial-gradient(circle,#f5e6aa,#a78942 37%,#2d2517 72%);box-shadow:0 0 34px #d9b95b55;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.04)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.card{border:1px solid #6e6042;background:linear-gradient(145deg,#2a2530,#17151d);border-radius:25px;padding:21px;text-align:center}.rarity{font-size:12px;letter-spacing:3px;color:var(--gold)}.icon{font-size:68px;margin:10px}.card h2{font-size:26px;margin:3px}.subtitle{color:var(--gold);margin:5px 0 14px}.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chip{background:#2d2934;border:1px solid #443d4c;border-radius:999px;padding:7px 9px;font-size:13px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.pillar{background:#191720;border:1px solid var(--line);border-radius:13px;padding:9px 3px}.pillar small{display:block;color:var(--muted);margin-bottom:5px}.pillar strong{font-size:18px}
.five{margin-top:17px;text-align:left}.stat{display:grid;grid-template-columns:28px 1fr 46px;align-items:center;gap:8px;margin:8px 0}.bar{height:8px;background:#393440;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--gold)}
.dna{text-align:left;background:#191720;border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:15px;line-height:1.7;font-size:13px;color:#d8d1dd}.dna b{color:var(--gold)}
.level{display:flex;justify-content:space-between}.xp{height:9px;background:#393440;border-radius:9px;overflow:hidden;margin:9px 0}.xp i{display:block;height:100%;background:var(--gold);width:0}.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.actions button{margin-top:8px}.small{text-align:center;color:var(--muted);font-size:12px;margin-top:15px}
.warn{border-left:3px solid var(--gold);padding-left:10px}
</style>
</head>
<body><main>
<section class="hero"><b>✦</b><h1>本命角色覺醒</h1><p>八字五行 × 星象 × 角色 DNA</p></section>

<section class="panel" id="formPanel">
<h2>建立本命資料</h2>
<form id="f">
<label>國曆生日</label><input id="birth" type="date" required>
<div class="row">
<div><label>出生時辰</label><select id="hour" required><option value="">請選擇</option><option>子時</option><option>丑時</option><option>寅時</option><option>卯時</option><option>辰時</option><option>巳時</option><option>午時</option><option>未時</option><option>申時</option><option>酉時</option><option>戌時</option><option>亥時</option></select></div>
<div><label>性別</label><select id="sex" required><option value="">請選擇</option><option>女</option><option>男</option><option>不指定</option></select></div>
</div>
<label>出生地</label><input id="place" placeholder="例如：台中市" required>
<button>開始本命覺醒</button>
</form>
<p class="privacy">🔒 公開版不含任何玩家個資。輸入資料只在目前瀏覽器中即時計算，本版不會上傳或寫入 GitHub。</p>
</section>

<section class="panel hidden reveal" id="reveal"><div class="orb" id="orb">✦</div><h2 id="revealTxt">正在推演四柱…</h2><p class="note">正在形成你的本命角色 DNA</p></section>

<section class="hidden" id="result">
<div class="card">
<div class="rarity">ORIGIN · 本命卡</div><div class="icon" id="icon">✦</div>
<h2 id="name"></h2><div class="subtitle" id="title"></div>
<div class="chips"><span class="chip" id="zodiac"></span><span class="chip" id="yin"></span><span class="chip" id="season"></span></div>
<div class="pillars">
<div class="pillar"><small>年柱</small><strong id="yp"></strong></div><div class="pillar"><small>月柱</small><strong id="mp"></strong></div><div class="pillar"><small>日柱</small><strong id="dp"></strong></div><div class="pillar"><small>時柱</small><strong id="hp"></strong></div>
</div>
<div class="five" id="five"></div>
<div class="dna" id="dna"></div>
<p class="note warn">目前五行比例採「四柱八字表層八字」統計，用於角色生成測試；尚未加入藏干、旺衰、喜用神，因此不把它宣稱為完整命理強弱判定。</p>
</div>
<section class="panel">
<div class="level"><strong id="lv">Lv. 1</strong><span id="xpt">成長 0 / 100</span></div><div class="xp"><i id="xpb"></i></div>
<div class="actions"><button type="button" id="train">修煉 +10</button><button type="button" id="bond">互動 +5</button></div>
<p class="note" id="growNote">角色 DNA 已固定。未來接 AI 人物時，同一角色種子可作為外觀一致性的基礎。</p>
<button class="secondary" type="button" id="reset">重新測試</button>
</section>
</section>
<p class="small">Beta 測試版 · 娛樂與自我探索用途</p>
</main>
<script>
(()=>{
const S=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'], B=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const SE=['木','木','火','火','土','土','金','金','水','水'], BE=['水','土','木','木','土','火','火','土','金','金','土','水'];
const I={木:['🌿','生木之魂'],火:['🔥','炎火之魂'],土:['⛰️','厚土之魂'],金:['⚔️','剛金之魂'],水:['💧','靈水之魂']};
const solarStarts=[[1,6],[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7]];
function jdn(y,m,d){let a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function dayP(y,m,d){let n=(jdn(y,m,d)+49)%60;return {si:n%10,bi:n%12,text:S[n%10]+B[n%12]}}
function beforeLiChun(y,m,d){return m<2||(m===2&&d<4)}
function yearP(y,m,d){let yy=beforeLiChun(y,m,d)?y-1:y,si=(yy-4)%10,bi=(yy-4)%12;return {si:(si+10)%10,bi:(bi+12)%12,text:S[(si+10)%10]+B[(bi+12)%12]}}
function monthIndex(m,d){let starts=solarStarts, idx=m-1;if(d<starts[idx][1])idx--;if(idx<0)idx=11;return idx}
function monthP(y,m,d,ysi){let idx=monthIndex(m,d);let branch=(idx+1)%12; // Jan Xiaohan=>Chou, Feb Lichun=>Yin
let tigerStem=((ysi%5)*2+2)%10;let offset=(branch-2+12)%12;let si=(tigerStem+offset)%10;return {si,bi:branch,text:S[si]+B[branch]}}
function hourP(dayStem,hname){let bi=B.indexOf(hname[0]);let ziStem=(dayStem%5)*2%10,si=(ziStem+bi)%10;return {si,bi,text:S[si]+B[bi]}}
function zodiac(m,d){let a=[['摩羯座','♑',1,20],['水瓶座','♒',2,19],['雙魚座','♓',3,21],['牡羊座','♈',4,20],['金牛座','♉',5,21],['雙子座','♊',6,22],['巨蟹座','♋',7,23],['獅子座','♌',8,23],['處女座','♍',9,23],['天秤座','♎',10,24],['天蠍座','♏',11,23],['射手座','♐',12,22]];for(let i=0;i<a.length;i++){let next=a[(i+1)%12],nm=next[2],nd=next[3];if((m===a[i][2]&&d>=a[i][3])||(m===nm&&d<nd))return a[i]}return a[11]}
function hash(s){let h=2166136261>>>0;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pick(a,h,n){return a[(h>>>n)%a.length]}
function dna(h,el,z){let hair=['長髮','及肩髮','俐落短髮','高束髮','半束長髮'],eyes=['清冷','沉靜','明亮','銳利','溫柔'],temper=['沉著','敏銳','溫和','果決','內斂','靈動'],dress=['輕甲','長袍','束袖勁裝','層疊法衣','簡潔戰裝'];return {hair:pick(hair,h,1),eye:pick(eyes,h,5),temper:pick(temper,h,9),dress:pick(dress,h,13),seed:h.toString(16).toUpperCase().padStart(8,'0'),z}}
function counts(ps){let c={木:0,火:0,土:0,金:0,水:0};ps.forEach(p=>{c[SE[p.si]]++;c[BE[p.bi]]++});return c}
function seasonName(m,d){let i=monthIndex(m,d);return ['寒土','初春','仲春','暮春','初夏','仲夏','暮夏','初秋','仲秋','暮秋','初冬','仲冬'][i]}
let xp=0;
document.querySelector('#f').addEventListener('submit',e=>{e.preventDefault();let v=birth.value,hr=hour.value;if(!v||!hr||!sex.value||!place.value.trim())return;let [y,m,d]=v.split('-').map(Number),Y=yearP(y,m,d),D=dayP(y,m,d),M=monthP(y,m,d,Y.si),H=hourP(D.si,hr),ps=[Y,M,D,H],c=counts(ps),el=SE[D.si],yn=D.si%2?'陰':'陽',z=zodiac(m,d),h=hash([v,hr,sex.value,place.value.trim()].join('|')),rd=dna(h,el,z[0]);
formPanel.classList.add('hidden');reveal.classList.remove('hidden');setTimeout(()=>{orb.textContent=I[el][0];revealTxt.textContent=`本命 ${yn}${el} · 四柱形成`},550);
setTimeout(()=>{reveal.classList.add('hidden');result.classList.remove('hidden');icon.textContent=I[el][0];name.textContent=`${S[D.si]}${el}・本命化身`;title.textContent=I[el][1];zodiac.textContent=`${z[1]} ${z[0]}`;yin.textContent=`${yn}${el}`;season.textContent=seasonName(m,d);yp.textContent=Y.text;mp.textContent=M.text;dp.textContent=D.text;hp.textContent=H.text;
let total=8;five.innerHTML=['木','火','土','金','水'].map(k=>{let pct=Math.round(c[k]/total*100);return `<div class="stat"><span>${k}</span><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`}).join('');
let top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];dna.innerHTML=`<b>角色 DNA</b><br>本命核心：${yn}${el}　表層五行偏向：${top}<br>角色氣質：${rd.temper}　髮型：${rd.hair}<br>視線：${rd.eye}　服裝原型：${rd.dress}<br>星象：${rd.z}<br>角色種子：${rd.seed}`;
},1350)});
function grow(n){xp+=n;let l=Math.floor(xp/100)+1,r=xp%100;lv.textContent='Lv. '+l;xpt.textContent=`成長 ${r} / 100`;xpb.style.width=r+'%';if(l>=3)growNote.textContent='✦ 已達動態覺醒門檻：後續版本可銜接 2D 動態／3D 化身。'}
train.addEventListener('click',()=>grow(10));bond.addEventListener('click',()=>grow(5));reset.addEventListener('click',()=>{xp=0;result.classList.add('hidden');formPanel.classList.remove('hidden');grow(0)});
})();
</script></body></html>
